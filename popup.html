<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 450px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .lang-select {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .lang-select option { color: #333; }
    .tab-count {
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .tabs-nav {
      display: flex;
      background: white;
      border-bottom: 1px solid #e0e0e0;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #667eea; }
    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    .view {
      display: none;
      max-height: 450px;
      overflow-y: auto;
      background: white;
    }
    .view.active { display: block; }
    
    /* Current Tabs View */
    .current-tabs-header {
      padding: 12px 20px;
      background: #f9f9f9;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .select-actions {
      display: flex;
      gap: 8px;
      font-size: 12px;
    }
    .select-actions button {
      background: none;
      border: none;
      color: #667eea;
      cursor: pointer;
      padding: 4px 8px;
    }
    .select-actions button:hover { text-decoration: underline; }
    .tab-item {
      padding: 10px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }
    .tab-item:hover { background: #f9f9f9; }
    .tab-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .tab-info {
      flex: 1;
      min-width: 0;
    }
    .tab-title {
      font-size: 13px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-url {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-close {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      line-height: 1;
    }
    .tab-close:hover { color: #ef4444; }
    .save-selected-bar {
      position: sticky;
      bottom: 0;
      background: white;
      border-top: 2px solid #667eea;
      padding: 12px 20px;
      display: none;
    }
    .save-selected-bar.show { display: block; }
    .save-input-group {
      display: flex;
      gap: 8px;
    }
    .save-input-group input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }
    
    /* Saved Sessions View */
    .save-section {
      background: white;
      padding: 16px 20px;
      border-bottom: 1px solid #e0e0e0;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover { background: #5568d3; }
    .btn-small {
      padding: 6px 12px;
      font-size: 13px;
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover { background: #dc2626; }
    .btn-success {
      background: #10b981;
      color: white;
    }
    .btn-success:hover { background: #059669; }
    .sessions-list {
      background: white;
    }
    .session-item {
      padding: 12px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .session-item:hover { background: #f9f9f9; }
    .session-info { flex: 1; }
    .session-name {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 4px;
    }
    .session-meta {
      font-size: 12px;
      color: #999;
    }
    .session-actions {
      display: flex;
      gap: 6px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    .status {
      padding: 8px 20px;
      font-size: 13px;
      text-align: center;
      background: #f0fdf4;
      color: #166534;
      display: none;
    }
    .status.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>📑 <span data-i18n="appName">Tab Manager</span></h1>
      <select class="lang-select" id="langSelect">
        <option value="en">English</option>
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="ja">日本語</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="ar">العربية</option>
      </select>
    </div>
    <span class="tab-count" id="currentTabCount">0 tabs</span>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" data-view="current" data-i18n="currentTabs">Current Tabs</button>
    <button class="tab-btn" data-view="saved" data-i18n="savedSessions">Saved Sessions</button>
  </div>

  <div class="status" id="status"></div>

  <!-- Current Tabs View -->
  <div class="view active" id="currentView">
    <div class="current-tabs-header">
      <span style="font-size: 13px; color: #666;">
        <span id="selectedCount">0</span> <span data-i18n="selected">selected</span>
      </span>
      <div class="select-actions">
        <button id="selectAllBtn" data-i18n="selectAll">Select All</button>
        <button id="deselectAllBtn" data-i18n="deselectAll">Deselect All</button>
      </div>
    </div>
    <div id="currentTabsList"></div>
    <div class="save-selected-bar" id="saveSelectedBar">
      <div class="save-input-group">
        <input type="text" id="selectedSessionName" data-i18n-placeholder="sessionNamePlaceholder" placeholder="Session name">
        <button class="btn btn-primary" id="saveSelectedBtn" data-i18n="saveSelected">Save Selected</button>
      </div>
    </div>
  </div>

  <!-- Saved Sessions View -->
  <div class="view" id="savedView">
    <div class="save-section">
      <div class="input-group">
        <input type="text" id="sessionName" data-i18n-placeholder="sessionNamePlaceholder" placeholder="Session name (e.g., Work, Research)">
        <button class="btn btn-primary" id="saveAllBtn" data-i18n="saveAll">Save All</button>
      </div>
    </div>
    <div class="sessions-list" id="sessionsList">
      <div class="empty-state">
        <div class="empty-state-icon">📁</div>
        <div data-i18n="noSessions">No saved sessions yet</div>
        <div style="font-size: 12px; margin-top: 8px;" data-i18n="noSessionsHint">Save your tabs to get started</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
